<!--{"title":"Become a Dealer | Crystal Box Group","desc":"Become a Crystal Box Group dealer.","canon":"become-a-dealer/","cls":"nodock"}-->
<section class="top narrow"><div class="wrap">
  <h1>Become a Dealer</h1>
  <p>Our partners gain access to premium products, strategic support, and a team committed to helping them win.</p>
</div></section>
<section class="wrap narrow">
  <form novalidate data-event="dealer_submit">
    <div class="f"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required aria-describedby="e-name"><p class="e" id="e-name"></p></div>
    <div class="f"><label for="company">Company name</label><input id="company" name="company" autocomplete="organization" required aria-describedby="e-company"><p class="e" id="e-company"></p></div>
    <div class="f"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="e-email"><p class="e" id="e-email"></p></div>
    <div class="f"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" required aria-describedby="e-phone"><p class="e" id="e-phone"></p></div>
    <div class="f"><label for="website">Company website</label><input id="website" name="website" inputmode="url" autocomplete="url" required aria-describedby="e-website"><p class="e" id="e-website"></p></div>
    <div class="f"><label for="place">City / State</label><input id="place" name="place" required aria-describedby="e-place"><p class="e" id="e-place"></p></div>
    <div class="f w"><label for="country">Country</label><input id="country" name="country" autocomplete="country-name" required aria-describedby="e-country"><p class="e" id="e-country"></p></div>
    <div class="f w"><label for="why">Why are you interested in becoming a Crystal Box Group dealer?</label><textarea id="why" name="why" rows="4" required aria-describedby="e-why"></textarea><p class="e" id="e-why"></p></div>
    {{send:Become a Dealer}}
  </form>
  <div class="sent" tabindex="-1" hidden><h2></h2><p></p></div>
</section>
